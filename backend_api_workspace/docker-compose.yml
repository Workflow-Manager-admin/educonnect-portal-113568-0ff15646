version: "3.8"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: eduportal
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d eduportal"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend_api:
    build: ./backend_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:password@db:5432/eduportal
      - SECRET_KEY=supersecretkeychangeit
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - TZ=UTC
    ports:
      - "8000:8000"
    volumes:
      - ./backend_api/src:/app/src
      - ./backend_api/alembic:/app/alembic
      - ./backend_api/alembic.ini:/app/alembic.ini
      - ./media:/app/media # For PDF uploads/downloads
    command: sh -c "alembic upgrade head && uvicorn src.api.main:app --host 0.0.0.0 --port 8000"
    working_dir: /app

volumes:
  postgres_data:
  media:
